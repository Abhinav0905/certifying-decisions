name: Verify archived results and primary comparison

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: research/requirements.txt
      - name: Verify release file hashes
        run: sha256sum --check SHA256SUMS
      - name: Install pinned scientific packages
        run: python -m pip install -r research/requirements.txt
      - name: Replay archive and rerun experiment
        run: python research/verify_release.py --allow-secondary-drift > verification.json
      - name: Show exact verification status
        if: always()
        run: cat verification.json
